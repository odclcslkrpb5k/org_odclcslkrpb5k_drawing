# docker compose -f docker/compose.yaml run --build --rm check    every check, offline (TC-5, TS-1)
# docker compose -f docker/compose.yaml run --build --rm plants   every control's planted bug (TS-5)
# docker compose -f docker/compose.yaml run --build --rm dev CMD  writes to the tree, with network
name: drawing

x-image: &image
  build:
    context: ..
    dockerfile: docker/Dockerfile
  # A name of its own, never an upstream tag (DB-2).
  image: drawing-check:dev

services:
  check:
    <<: *image
    network_mode: none

  plants:
    <<: *image
    network_mode: none
    command: ["tools/checks/plants"]

  # Generating configs and lockfiles, formatting: mounts the working tree and has a network.
  dev:
    <<: *image
    volumes:
      - ..:/repo
      - /repo/.gradle
